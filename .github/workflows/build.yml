name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
            name: Apple Silicon
          - os: macos-13
            arch: x86_64
            name: Intel
    
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build
        run: chmod +x build.sh && ./build.sh
      
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SakuraClipboard-${{ matrix.arch }}
          path: SakuraClipboard.dmg

  release:
    needs: build
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/SakuraClipboard-arm64/SakuraClipboard.dmg
            artifacts/SakuraClipboard-x86_64/SakuraClipboard.dmg
          generate_release_notes: true
          name: SakuraClipboard ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
