name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    name: Build Universal Binary
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build Universal Binary
        run: |
          chmod +x build.sh
          # Build for ARM
          swiftc -O -framework Cocoa -framework ServiceManagement -framework Carbon -lsqlite3 \
            -target arm64-apple-macos11.0 \
            Sources/*.swift -o build/SakuraClipboard-arm64
          # Build for Intel
          swiftc -O -framework Cocoa -framework ServiceManagement -framework Carbon -lsqlite3 \
            -target x86_64-apple-macos11.0 \
            Sources/*.swift -o build/SakuraClipboard-x86_64
          # Create universal binary
          lipo -create -output build/SakuraClipboard \
            build/SakuraClipboard-arm64 \
            build/SakuraClipboard-x86_64
          # Package
          ./build.sh
      
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SakuraClipboard
          path: SakuraClipboard.dmg

  release:
    needs: build
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/SakuraClipboard/SakuraClipboard.dmg
          generate_release_notes: true
          name: SakuraClipboard ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
